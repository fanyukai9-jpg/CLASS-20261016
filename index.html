<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="一目了然的每日行程與待辦事項。">
  <title>日常清單 — 今天的安排</title>
  <style>
    :root{color-scheme:light;--paper:#f6f5f0;--card:#fffefa;--ink:#20271f;--muted:#85877e;--line:#e9e8df;--green:#506b52;--pale:#edf2e9;--shadow:0 14px 38px rgb(43 48 37 / 5%)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{color:inherit}.page{width:min(100% - 48px,1040px);margin:auto;padding:48px 0 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:54px}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.06em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--green);color:white;font-size:17px}.top-note{color:var(--muted);font-size:13px}.hero{margin-bottom:36px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.14em}h1{margin:0;font-size:clamp(30px,5vw,44px);font-weight:600;letter-spacing:-.055em;line-height:1.25}.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:13px}.date-time{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}.date{color:var(--muted);font-size:14px}.clock{color:var(--green);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.06em}.day-count{flex:0 0 auto;color:var(--green);font-size:13px;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);align-items:start;gap:22px}.column{display:grid;gap:22px;min-width:0}.card{min-width:0;padding:25px;border:1px solid rgb(46 49 38 / 5%);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.025em}.section-label{color:var(--muted);font-size:12px}.schedule{display:grid}.event{display:grid;grid-template-columns:58px 14px minmax(0,1fr);gap:12px;min-height:73px}.event-time{padding-top:2px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.event-track{position:relative;display:flex;justify-content:center}.event-track:after{position:absolute;top:12px;bottom:-3px;width:1px;background:var(--line);content:""}.event:last-child .event-track:after{display:none}.event-dot{position:relative;z-index:1;width:9px;height:9px;margin-top:8px;border:2px solid #91a78b;border-radius:50%;background:var(--card)}.event:first-child .event-dot{border-color:var(--green);background:var(--green)}.event-title{margin:0;font-size:14px;font-weight:600}.event-detail{margin:3px 0 14px;color:var(--muted);font-size:12px}.todo-list{display:grid}.todo{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.todo:last-child{padding-bottom:2px;border:0}.todo-check{display:grid;flex:0 0 19px;place-items:center;width:19px;height:19px;margin-top:2px;border:1.5px solid #d6d8ce;border-radius:6px;background:transparent;cursor:pointer}.todo-check[aria-pressed=true]{border-color:var(--green);background:var(--green);color:white}.todo-check[aria-pressed=true]:after{content:"✓";font-size:12px;line-height:1}.todo-copy{min-width:0;flex:1}.todo-title{margin:0;font-size:13px;font-weight:550;overflow-wrap:anywhere}.todo.done .todo-title{color:var(--muted);text-decoration:line-through}.todo-meta{margin:3px 0 0;color:var(--muted);font-size:11px}.status{flex:0 0 auto;padding:3px 9px;border-radius:999px;background:#f4efe4;color:#967540;font-size:10px;line-height:1.6;white-space:nowrap}.status.done{background:var(--pale);color:var(--green)}.item-actions{display:flex;flex:0 0 auto;align-items:center;gap:5px}.action-button{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--green);font-size:11px;line-height:1.3;cursor:pointer}.action-button:hover{border-color:#b7c3b0;background:var(--pale)}.action-button.delete{color:#a05d4c}.action-button.delete:hover{border-color:#dfc1b8;background:#faf0ed}.todo.is-deleted,.event.is-deleted{opacity:.67}.todo.is-deleted .todo-title,.event.is-deleted .event-title{text-decoration:line-through}.restore-note{margin:14px 0 0;color:var(--muted);font-size:12px}.restore-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.deleted-entry{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#faf9f4;color:var(--muted);font-size:11px}.deleted-entry span{overflow-wrap:anywhere}.restore-button{padding:3px 7px;border:0;border-radius:6px;background:var(--pale);color:var(--green);font-size:11px;cursor:pointer}
    .form-card{background:#f0f1e9;box-shadow:none}.form-intro{margin:5px 0 18px;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}label{color:#60665b;font-size:11px;font-weight:600}input,textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid #e4e5db;border-radius:9px;outline:none;background:var(--card);color:var(--ink);font-size:13px}input:focus,textarea:focus{border-color:#80947a;box-shadow:0 0 0 3px rgb(80 107 82 / 9%)}textarea{min-height:65px;resize:vertical}.add-button{width:100%;margin-top:15px;padding:10px 15px;border:0;border-radius:9px;background:var(--green);color:white;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .2s}.add-button:hover{transform:translateY(-1px);background:#3f5942}.add-button:focus-visible,.todo-check:focus-visible{outline:3px solid #9aac93;outline-offset:3px}.today-chip{display:inline-flex;align-items:center;gap:6px;margin:0 0 15px;padding:5px 10px;border:1px solid #e7e8de;border-radius:999px;background:#fffefa;color:var(--green);font-size:11px;font-weight:600}.today-chip:before{width:6px;height:6px;border-radius:50%;background:#80a079;content:""}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.todo-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:16px}.todo-form input{min-width:0}.todo-form .add-button{width:auto;margin:0;white-space:nowrap;padding-right:13px;padding-left:13px}.footer{margin-top:30px;color:#a0a095;font-size:11px;text-align:center}
    @media(max-width:680px){.page{width:min(100% - 32px,480px);padding-top:28px}.topbar{margin-bottom:38px}.top-note{max-width:125px;text-align:right}.layout{grid-template-columns:minmax(0,1fr);gap:16px}.column{gap:16px}.card{padding:21px 19px;border-radius:15px}.hero{margin-bottom:25px}.todo{flex-wrap:wrap}.todo-copy{flex-basis:calc(100% - 42px)}.todo .status,.todo .item-actions{margin-left:31px}.event{grid-template-columns:58px 14px minmax(0,1fr)}.event .item-actions{grid-column:3;margin-top:-5px;margin-bottom:10px}}
    @media(max-width:360px){.page{width:calc(100% - 24px)}.card{padding-right:15px;padding-left:15px}.event{grid-template-columns:49px 12px minmax(0,1fr);gap:9px}.status{padding-right:7px;padding-left:7px;font-size:9px}.todo-form{grid-template-columns:minmax(0,1fr)}.todo-form .add-button{width:100%}.day-count{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
    .event-edit-fields{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.todo-edit-fields{min-width:0;flex:1;display:grid;gap:7px}.event-edit-title{grid-column:1/-1}.edit-field{min-width:0;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}.save-button{color:var(--green);background:var(--pale)}
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">日</span><span>日常清單</span></div><span class="top-note">留一點空白，給今天的自己。</span></header>
    <section class="hero" aria-labelledby="page-title"><p class="eyebrow">YOUR DAY, AT A GLANCE</p><h1 id="page-title">今天的安排</h1><div class="hero-bottom"><div class="date-time"><time class="date" id="today-date"></time><time class="clock" id="live-clock" aria-label="現在時間" aria-live="off"></time></div><span class="day-count">星期裡，也有剛剛好的步調。</span></div></section>
    <div class="layout"><div class="column">
      <section class="card" aria-labelledby="schedule-heading"><div class="section-heading"><h2 id="schedule-heading">今日行程</h2><span class="section-label" id="event-count">03 個安排</span></div><p class="today-chip" id="schedule-date" aria-label="今日行程日期"></p><div class="schedule" id="schedule-list" aria-live="polite">
        <article class="event"><time class="event-time" datetime="09:00">09:00</time><span class="event-track"><span class="event-dot"></span></span><div><h3 class="event-title">晨間咖啡與閱讀</h3><p class="event-detail">在熟悉的咖啡店，慢慢開始一天</p></div><div class="item-actions"><button class="action-button" type="button" data-action="edit">編輯</button><button class="action-button delete" type="button" data-action="delete">刪除</button></div></article>
        <article class="event"><time class="event-time" datetime="11:30">11:30</time><span class="event-track"><span class="event-dot"></span></span><div><h3 class="event-title">設計團隊週會</h3><p class="event-detail">三樓會議室 · 記得帶上筆記本</p></div><div class="item-actions"><button class="action-button" type="button" data-action="edit">編輯</button><button class="action-button delete" type="button" data-action="delete">刪除</button></div></article>
        <article class="event"><time class="event-time" datetime="15:00">15:00</time><span class="event-track"><span class="event-dot"></span></span><div><h3 class="event-title">公園散步</h3><p class="event-detail">曬曬太陽，讓思緒透透氣</p></div><div class="item-actions"><button class="action-button" type="button" data-action="edit">編輯</button><button class="action-button delete" type="button" data-action="delete">刪除</button></div></article>
      </div></section>
      <section class="card" aria-labelledby="todo-heading"><div class="section-heading"><h2 id="todo-heading">待辦事項</h2><span class="section-label" id="todo-count">1 / 3 完成</span></div><div class="todo-list" id="todo-list">
        <article class="todo"><button type="button" class="todo-check" aria-label="標記：整理本週工作重點" aria-pressed="false"></button><div class="todo-copy"><p class="todo-title">整理本週工作重點</p><p class="todo-meta">工作 · 今天</p></div><span class="status">待處理</span><div class="item-actions"><button class="action-button" type="button" data-action="edit" aria-label="編輯整理本週工作重點">編輯</button><button class="action-button delete" type="button" data-action="delete" aria-label="刪除整理本週工作重點">刪除</button></div></article>
        <article class="todo done"><button type="button" class="todo-check" aria-label="標記：回覆設計合作信件" aria-pressed="true"></button><div class="todo-copy"><p class="todo-title">回覆設計合作信件</p><p class="todo-meta">工作 · 今天</p></div><span class="status done">已完成</span><div class="item-actions"><button class="action-button" type="button" data-action="edit" aria-label="編輯回覆設計合作信件">編輯</button><button class="action-button delete" type="button" data-action="delete" aria-label="刪除回覆設計合作信件">刪除</button></div></article>
        <article class="todo"><button type="button" class="todo-check" aria-label="標記：下班後買些水果" aria-pressed="false"></button><div class="todo-copy"><p class="todo-title">下班後買些水果</p><p class="todo-meta">生活 · 今天</p></div><span class="status">待處理</span><div class="item-actions"><button class="action-button" type="button" data-action="edit" aria-label="編輯下班後買些水果">編輯</button><button class="action-button delete" type="button" data-action="delete" aria-label="刪除下班後買些水果">刪除</button></div></article>
      </div>
        <form class="todo-form" id="todo-form"><label class="visually-hidden" for="todo-name">新增待辦事項</label><input id="todo-name" name="todo" type="text" placeholder="新增一項待辦⋯⋯" required maxlength="80"><button class="add-button" type="submit">＋ 新增待辦</button></form>
      </section>
    </div>
    <div class="column">
      <section class="card form-card" aria-labelledby="add-heading">
        <div class="section-heading"><h2 id="add-heading">新增行程</h2><span class="section-label" aria-hidden="true">✳</span></div>
        <p class="form-intro">把想做的事，放進今天的時間裡。</p>
        <form id="event-form"><div class="form-grid">
          <div class="field full"><label for="event-name">行程名稱</label><input id="event-name" name="name" type="text" placeholder="例如：和朋友吃午餐" required maxlength="60"></div>
          <div class="field"><label for="event-date">日期</label><input id="event-date" name="date" type="date" required></div>
          <div class="field"><label for="event-time">時間</label><input id="event-time" name="time" type="time" required></div>
          <div class="field full"><label for="event-place">地點</label><input id="event-place" name="place" type="text" placeholder="選填" maxlength="50"></div>
          <div class="field full"><label for="event-note">備註</label><textarea id="event-note" name="note" placeholder="補充一點小提醒⋯⋯" maxlength="160"></textarea></div>
        </div><button class="add-button" type="submit">＋&nbsp; 加入今日行程</button></form>
      </section>
    </div></div>
    <footer class="footer">把日子過成喜歡的樣子。</footer>
  </main>
  <script>
    (() => {
      const form = document.getElementById('event-form');
      const todoForm = document.getElementById('todo-form');
      const schedule = document.getElementById('schedule-list');
      const eventCount = document.getElementById('event-count');
      const date = new Date();
      const dateNode = document.getElementById('today-date');
      dateNode.textContent = new Intl.DateTimeFormat('zh-TW', {year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);
      dateNode.dateTime = [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
      const clockNode = document.getElementById('live-clock');
      const updateClock = () => {
        const now = new Date();
        clockNode.textContent = new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
      };
      updateClock();
      window.setInterval(updateClock,1000);
      const dateParts = {year:date.getFullYear(),month:String(date.getMonth()+1).padStart(2,'0'),day:String(date.getDate()).padStart(2,'0')};
      const todayISO = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
      const todayLabel = new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);
      document.getElementById('schedule-date').textContent = `今天・${todayLabel}`;
      const todoList = document.getElementById('todo-list');
      const todoCount = document.getElementById('todo-count');
      let restoreList, restoreBox;
      const makeRestoreBox = () => {
        restoreBox = document.createElement('section'); restoreBox.className = 'restore-note';
        restoreBox.setAttribute('aria-label','最近刪除的項目');
        const heading = document.createElement('div'); heading.textContent = '最近刪除（可復原）';
        restoreList = document.createElement('div'); restoreList.className = 'restore-list';
        restoreBox.append(heading,restoreList); todoList.closest('.card').insertBefore(restoreBox,todoForm);
      };

      makeRestoreBox();
      const updateTodos = () => {
        const todos = [...todoList.querySelectorAll('.todo')].filter(todo => !todo.classList.contains('is-deleted'));
        const completed = todos.filter(todo => todo.querySelector('.todo-check').getAttribute('aria-pressed') === 'true').length;
        todoCount.textContent = `${completed} / ${todos.length} 完成`;
      };
      todoList.addEventListener('click', event => {
        const button = event.target.closest('.todo-check');
        if (!button) return;
        const todo = button.closest('.todo');
        if (todo.classList.contains('is-deleted')) return;
        const completed = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(completed));
        todo.classList.toggle('done', completed);
        const status = todo.querySelector('.status');
        status.textContent = completed ? '已完成' : '待處理';
        status.classList.toggle('done', completed);
        updateTodos();
      });
      let restoreList;
      let restoreBox;
      const makeRestoreBox = () => {
        restoreBox = document.createElement('section');
        restoreBox.className = 'restore-note';
        restoreBox.setAttribute('aria-label','最近刪除的項目');
        const restoreHeading = document.createElement('div'); restoreHeading.textContent = '最近刪除（可復原）';
        restoreBox.append(restoreHeading);
        todoList.closest('.card').insertBefore(restoreBox,todoForm);
        restoreList = document.createElement('div'); restoreList.className = 'restore-list';
        restoreBox.append(restoreList);
      };
      const formatEventDate = iso => { if (!iso) return ''; const [year,month,day] = iso.split('-'); return `${year} 年 ${Number(month)} 月 ${Number(day)} 日${iso === todayISO ? ' · 今天' : ''}`; };
      const updateRestoreList = () => {
        restoreList.replaceChildren();
        const deleted=[...todoList.querySelectorAll('.todo.is-deleted')].map(item=>({item,kind:'todo'})).concat([...schedule.querySelectorAll('.event.is-deleted')].map(item=>({item,kind:'event'})));
        restoreBox.hidden=deleted.length===0;const indexes={todo:0,event:0};
        for(const {item,kind} of deleted){const entry=document.createElement('div');entry.className='deleted-entry';entry.dataset.kind=kind;entry.dataset.index=String(indexes[kind]++);const name=document.createElement('span');name.textContent=item.querySelector('.todo-title,.event-title').textContent;const restore=document.createElement('button');restore.type='button';restore.className='restore-button';restore.dataset.action='restore';restore.textContent='復原';restore.setAttribute('aria-label',`復原${name.textContent}`);entry.append(name,restore);restoreList.append(entry);}
      };
      const initializeEvents = () => schedule.querySelectorAll('.event').forEach(item => {
        const time=item.querySelector('.event-time').textContent;const timeNode=item.querySelector('.event-time');
        if(!timeNode.dateTime.includes('T'))timeNode.dateTime=`${todayISO}T${time}`;
        let dateLabel=item.querySelector('.event-detail[data-event-date]');
        if(!dateLabel){dateLabel=document.createElement('p');dateLabel.className='event-detail';dateLabel.dataset.eventDate=todayISO;dateLabel.textContent=`📅 ${formatEventDate(todayISO)}`;item.querySelector(':scope > div:nth-of-type(2)').append(dateLabel);}
      });
      const createActions = () => {
        const actions=document.createElement('div'); actions.className='item-actions';
        for(const [action,label,extra] of [['edit','編輯',''],['delete','刪除',' delete']]){const button=document.createElement('button');button.type='button';button.className=`action-button${extra}`;button.dataset.action=action;button.textContent=label;actions.append(button);}
        return actions;
      };
      initializeEvents();
      const setActionLabels = item => {const title=item.querySelector('.todo-title,.event-title')?.textContent||'項目';item.querySelectorAll('[data-action]').forEach(button=>button.setAttribute('aria-label',`${({edit:'編輯',delete:'刪除',save:'儲存',cancel:'取消',restore:'復原'})[button.dataset.action]||'操作'}${title}`));};
      schedule.querySelectorAll('.event').forEach(item => {item.append(createActions());setActionLabels(item);});
      const updateEvents = () => {
        initializeEvents();
        schedule.querySelectorAll('.event').forEach(item=>{if(!item.querySelector('.item-actions')){item.append(createActions());setActionLabels(item);}});
        const events=[...schedule.querySelectorAll('.event')].sort((a,b)=>a.querySelector('.event-time').dateTime.localeCompare(b.querySelector('.event-time').dateTime));
        schedule.replaceChildren(...events);
        eventCount.textContent=`${String(events.filter(item=>!item.classList.contains('is-deleted')).length).padStart(2,'0')} 個安排`;
        events.forEach(item=>item.querySelectorAll('.event-detail[data-event-date]').forEach(label=>{label.textContent=`📅 ${formatEventDate(label.dataset.eventDate)}`}));
      };

      const beginEdit = item => {
        if(item.dataset.editing==='true'||item.classList.contains('is-deleted'))return;
        item.dataset.editing='true';
        const isTodo=item.classList.contains('todo');
        const heading=item.querySelector(isTodo?'.todo-title':'.event-title');
        const input=document.createElement('input');input.type='text';input.maxLength=isTodo?80:60;input.className=isTodo?'todo-edit-fields':'edit-field event-edit-title';input.value=heading.textContent;heading.replaceWith(input);
        const actions=item.querySelector('.item-actions');
        if(isTodo){
          for(const [action,label] of [['save','儲存'],['cancel','取消']]){const button=document.createElement('button');button.type='button';button.className='action-button';button.dataset.action=action;button.textContent=label;actions.append(button);}
          actions.querySelector('[data-action="edit"]').remove();actions.querySelector('[data-action="delete"]').remove();
        }else{
          const detailBox=item.querySelector(':scope > div:nth-of-type(2)');
          const dateLabel=item.querySelector('[data-event-date]');
          const oldDescription=item.querySelector('.event-detail:not([data-event-date])')?.textContent||'';
          detailBox.dataset.originalDescription=oldDescription;
          const values=[dateLabel?.dataset.eventDate||todayISO,item.querySelector('.event-time').textContent,'',''];
          if(oldDescription&&oldDescription!=='今天新增的行程'){const parts=oldDescription.split(' · ');values[2]=parts.shift()||'';values[3]=parts.join(' · ');}
          const fields=document.createElement('div');fields.className='event-edit-fields';fields.dataset.date=values[0];fields.dataset.description=oldDescription;
          for(const [index,type,label,placeholder] of [[0,'date','行程日期',''],[1,'time','行程時間',''],[2,'text','行程地點','地點（選填）'],[3,'text','行程備註','備註（選填）']]){const field=document.createElement('input');field.type=type;field.className='edit-field';field.maxLength=index===2?50:160;field.value=values[index];field.setAttribute('aria-label',label);if(placeholder)field.placeholder=placeholder;field.required=index<2;fields.append(field);}
          detailBox.replaceChildren(fields);
          for(const [action,label] of [['save','儲存'],['cancel','取消']]){const button=document.createElement('button');button.type='button';button.className='action-button';button.dataset.action=action;button.textContent=label;actions.append(button);}
          actions.querySelector('[data-action="edit"]').remove();actions.querySelector('[data-action="delete"]').remove();
        }
        input.focus();input.select();
      };

      const stopEdit = (item,save) => {
        if(item.dataset.editing!=='true')return;
        const isTodo=item.classList.contains('todo');
        const titleInput=item.querySelector(isTodo?'.todo-edit-fields':'.event-edit-title');
        const oldTitle=item.querySelector(isTodo?'.todo-title':'.event-title')?.textContent||'';
        const titleText=save&&titleInput.value.trim()?titleInput.value.trim():oldTitle;
        const heading=document.createElement(isTodo?'p':'h3');heading.className=isTodo?'todo-title':'event-title';heading.textContent=titleText;titleInput.replaceWith(heading);
        if(isTodo){item.querySelector('.item-actions').replaceWith(createActions());}
        else{
          const fields=item.querySelector('.event-edit-fields');const [dateInput,timeInput,placeInput,noteInput]=fields.querySelectorAll('input');
          const detailBox=item.querySelector(':scope > div:nth-of-type(2)');const dateValue=save&&dateInput.value?dateInput.value:fields.dataset.date;
          const description=save?([placeInput.value.trim(),noteInput.value.trim()].filter(Boolean).join(' · ')||'今天新增的行程'):(fields.dataset.description||'今天新增的行程');
          if(save){const time=item.querySelector('.event-time');time.textContent=timeInput.value;time.dateTime=`${dateValue}T${timeInput.value}`;}
          const detail=document.createElement('p');detail.className='event-detail';detail.textContent=description;
          const dateLabel=document.createElement('p');dateLabel.className='event-detail';dateLabel.dataset.eventDate=dateValue;dateLabel.textContent=`📅 ${formatEventDate(dateValue)}`;
          detailBox.replaceChildren(heading,detail,dateLabel);item.querySelector('.item-actions').replaceWith(createActions());
        }
        delete item.dataset.editing;if(save)setActionLabels(item);
      };
      const handleItemAction = event => {
        const button=event.target.closest('[data-action]');if(!button)return;
        if(button.dataset.action==='restore'){
          const entry=button.closest('.deleted-entry');const kind=entry.dataset.kind;const index=Number(entry.dataset.index);
          const item=(kind==='todo'?todoList:schedule).querySelectorAll(kind==='todo'?'.todo.is-deleted':'.event.is-deleted')[index];
          if(item)item.classList.remove('is-deleted');updateTodos();updateEvents();updateRestoreList();return;
        }
        const item=button.closest('.todo,.event');if(!item)return;
        if(button.dataset.action==='edit'){beginEdit(item);return;}
        if(button.dataset.action==='delete'){if(item.dataset.editing==='true')stopEdit(item,false);item.classList.add('is-deleted');updateTodos();updateEvents();updateRestoreList();return;}
        if(button.dataset.action==='cancel'){stopEdit(item,false);return;}
        if(button.dataset.action==='save'){
          const fields=item.querySelector('.event-edit-fields');
          if(fields&&[...fields.querySelectorAll('input[required]')].some(input=>!input.reportValidity()))return;
          if(!fields&&!item.querySelector('.todo-edit-fields').value.trim()){item.querySelector('.todo-edit-fields').focus();return;}
          stopEdit(item,true);updateTodos();updateEvents();updateRestoreList();
        }
      };
      todoList.addEventListener('click',handleItemAction);schedule.addEventListener('click',handleItemAction);restoreList.addEventListener('click',handleItemAction);
      updateRestoreList();
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const data = new FormData(form);
        const time = String(data.get('time'));
        const eventDate = String(data.get('date'));
        const node = document.createElement('article'); node.className = 'event';
        const timeNode = document.createElement('time'); timeNode.className = 'event-time'; timeNode.dateTime = `${eventDate}T${time}`; timeNode.textContent = time;
        const track = document.createElement('span'); track.className = 'event-track';
        const dot = document.createElement('span'); dot.className = 'event-dot'; track.append(dot);
        const detail = document.createElement('div');
        const title = document.createElement('h3'); title.className = 'event-title'; title.textContent = String(data.get('name')).trim();
        const description = [String(data.get('place')).trim(),String(data.get('note')).trim()].filter(Boolean).join(' · ') || '今天新增的行程';
        const subtitle = document.createElement('p'); subtitle.className = 'event-detail'; subtitle.textContent = description;
        const dateLabel = document.createElement('p'); dateLabel.className = 'event-detail'; dateLabel.dataset.eventDate = eventDate; dateLabel.textContent = `📅 ${formatEventDate(eventDate)}`;
        detail.append(title,subtitle,dateLabel); node.append(timeNode,track,detail,createActions()); setActionLabels(node);
        schedule.append(node); updateEvents();
        form.reset(); document.getElementById('event-date').value = todayISO; document.getElementById('event-name').focus();
      });

      todoForm.addEventListener('submit', event => {
        event.preventDefault();
        if (!todoForm.reportValidity()) return;
        const input = document.getElementById('todo-name');
        const title = input.value.trim();
        if (!title) { input.focus(); return; }
        const item = document.createElement('article'); item.className = 'todo';
        const check = document.createElement('button'); check.type = 'button'; check.className = 'todo-check';
        check.setAttribute('aria-label',`標記：${title}`); check.setAttribute('aria-pressed','false');
        const copy = document.createElement('div'); copy.className = 'todo-copy';
        const name = document.createElement('p'); name.className = 'todo-title'; name.textContent = title;
        const meta = document.createElement('p'); meta.className = 'todo-meta'; meta.textContent = '生活 · 今天';
        copy.append(name,meta);
        const status = document.createElement('span'); status.className = 'status'; status.textContent = '待處理';
        item.append(check,copy,status,createActions()); todoList.append(item); setActionLabels(item);
        updateTodos(); updateRestoreList(); todoForm.reset(); input.focus();
      });
      document.getElementById('event-date').value = todayISO;
    })();
  </script>
</body>
</html>
